<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Calendar Engine Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="css/calendar.css" />
    <style>
      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f6fb;
        color: #101828;
        margin: 0;
        padding: 2rem;
      }

      h1 {
        margin-top: 0;
      }

      .demo-grid {
        display: grid;
        gap: 2rem;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        margin-top: 2rem;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: center;
      }

      .controls label {
        display: flex;
        flex-direction: column;
        font-size: 0.85rem;
        color: #475467;
        gap: 0.35rem;
      }

      .controls select,
      .controls input {
        padding: 0.4rem 0.6rem;
        border-radius: 8px;
        border: 1px solid #d0d5dd;
        min-width: 120px;
      }
    </style>
    <script src="https://unpkg.com/date-holidays@3/dist/umd.min.js" defer></script>
    <script src="js/utils.js" defer></script>
    <script src="js/localization-data.js" defer></script>
    <script src="js/holiday-data.js" defer></script>
    <script src="js/calendar.js" defer></script>
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const yearInput = document.querySelector("#demo-year");
        const langSelect = document.querySelector("#demo-language");
        const startDaySelect = document.querySelector("#demo-start-day");
        const countrySelect = document.querySelector("#demo-country");
        const container = document.querySelector("#calendar-demo-grid");

        function populateLanguages() {
          const options = (window.LocalizationData?.languages || []).map(
            (lang) => `<option value="${lang.code}">${lang.label}</option>`
          );
          langSelect.innerHTML = options.join("");
          langSelect.value = "en";
        }

        function populateCountries() {
          const options = (window.LocalizationData?.countries || []).map(
            (country) => `<option value="${country.code}">${country.label}</option>`
          );
          countrySelect.innerHTML = options.join("");
          countrySelect.value = "US";
        }

        function renderCalendars() {
          if (!window.CalendarEngine) return;

          const year = Number(yearInput.value) || new Date().getFullYear();
          const language = langSelect.value;
          const startDay = startDaySelect.value;
          const country = countrySelect.value;

          container.innerHTML = "";

          [0, 1, 2].forEach((monthIndex) => {
            const { element } = window.CalendarEngine.renderMonth({
              year,
              monthIndex,
              language,
              startDay,
              country,
            });

            element.style.height = "100%";
            container.appendChild(element);
          });
        }

        populateLanguages();
        populateCountries();
        window.HolidayService?.init?.();
        window.CalendarEngine?.init?.();

        yearInput.value = new Date().getFullYear();
        renderCalendars();

        [yearInput, langSelect, startDaySelect, countrySelect].forEach((input) => {
          input.addEventListener("change", renderCalendars);
        });
      });
    </script>
  </head>
  <body>
    <h1>Calendar Engine Demo</h1>
    <p>
      Use the controls below to preview the first three months rendered by <code>CalendarEngine.renderMonth</code>.
    </p>

    <div class="controls">
      <label>
        Year
        <input id="demo-year" type="number" min="2020" max="2030" />
      </label>
      <label>
        Language
        <select id="demo-language"></select>
      </label>
      <label>
        Country
        <select id="demo-country"></select>
      </label>
      <label>
        Start Day
        <select id="demo-start-day">
          <option value="sunday">Sunday</option>
          <option value="monday">Monday</option>
          <option value="tuesday">Tuesday</option>
          <option value="wednesday">Wednesday</option>
          <option value="thursday">Thursday</option>
          <option value="friday">Friday</option>
          <option value="saturday">Saturday</option>
        </select>
      </label>
    </div>

    <section id="calendar-demo-grid" class="demo-grid" aria-live="polite"></section>
  </body>
</html>
