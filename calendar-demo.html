<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Calendar Engine Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="css/calendar.css" />
    <style>
      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f6fb;
        color: #101828;
        margin: 0;
        padding: 2rem;
      }

      h1 {
        margin-top: 0;
      }

      .demo-grid {
        display: grid;
        gap: 2rem;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        margin-top: 2rem;
      }

      .style-comparison {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
        margin-top: 2rem;
      }

      .style-section {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .style-section h2 {
        font-size: 1.1rem;
        font-weight: 600;
        color: #475467;
        margin: 0;
        padding-bottom: 0.5rem;
        border-bottom: 2px solid #e4e7ec;
      }

      .style-section h2.active {
        color: #7f56d9;
        border-bottom-color: #7f56d9;
      }

      @media (max-width: 768px) {
        .style-comparison {
          grid-template-columns: 1fr;
        }
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: center;
      }

      .controls label {
        display: flex;
        flex-direction: column;
        font-size: 0.85rem;
        color: #475467;
        gap: 0.35rem;
      }

      .controls select,
      .controls input {
        padding: 0.4rem 0.6rem;
        border-radius: 8px;
        border: 1px solid #d0d5dd;
        min-width: 120px;
      }
    </style>
    <script src="https://unpkg.com/date-holidays@3/dist/umd.min.js" defer></script>
    <script src="js/utils.js" defer></script>
    <script src="js/localization-data.js" defer></script>
    <script src="js/holiday-data.js" defer></script>
    <script src="js/calendar-data.js" defer></script>
    <script src="js/calendar.js" defer></script>
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const yearInput = document.querySelector("#demo-year");
        const langSelect = document.querySelector("#demo-language");
        const startDaySelect = document.querySelector("#demo-start-day");
        const countrySelect = document.querySelector("#demo-country");
        const layoutStyleSelect = document.querySelector("#demo-layout-style");
        const container = document.querySelector("#calendar-demo-grid");
        const comparisonContainer = document.querySelector("#calendar-comparison");

        function populateLanguages() {
          const options = (window.LocalizationData?.languages || []).map(
            (lang) => `<option value="${lang.code}">${lang.label}</option>`
          );
          langSelect.innerHTML = options.join("");
          langSelect.value = "en";
        }

        function populateCountries() {
          const options = (window.LocalizationData?.countries || []).map(
            (country) => `<option value="${country.code}">${country.label}</option>`
          );
          countrySelect.innerHTML = options.join("");
          countrySelect.value = "US";
        }

        function renderCalendars() {
          if (!window.CalendarEngine) return;

          const year = Number(yearInput.value) || new Date().getFullYear();
          const language = langSelect.value;
          const startDay = startDaySelect.value;
          const country = countrySelect.value;
          const layoutStyle = layoutStyleSelect?.value || window.CalendarEngine?.DEFAULT_LAYOUT_STYLE || "cellular";

          container.innerHTML = "";

          [0, 1, 2].forEach((monthIndex) => {
            const { element } = window.CalendarEngine.renderMonth({
              year,
              monthIndex,
              language,
              startDay,
              country,
              layoutStyle,
            });

            element.style.height = "100%";
            container.appendChild(element);
          });
        }

        function renderComparison() {
          if (!window.CalendarEngine || !comparisonContainer) return;

          const year = Number(yearInput.value) || new Date().getFullYear();
          const language = langSelect.value;
          const startDay = startDaySelect.value;
          const country = countrySelect.value;

          comparisonContainer.innerHTML = "";

          const cellularSection = document.createElement("div");
          cellularSection.className = "style-section";
          const cellularTitle = document.createElement("h2");
          cellularTitle.textContent = "Cellular Style (Rounded)";
          cellularTitle.classList.add("active");
          cellularSection.appendChild(cellularTitle);

          const appleSection = document.createElement("div");
          appleSection.className = "style-section";
          const appleTitle = document.createElement("h2");
          appleTitle.textContent = "Apple Style (Straight Lines)";
          appleSection.appendChild(appleTitle);

          // Render same month (January) in both styles
          [0].forEach((monthIndex) => {
            const cellularResult = window.CalendarEngine.renderMonth({
              year,
              monthIndex,
              language,
              startDay,
              country,
              layoutStyle: "cellular",
            });
            cellularSection.appendChild(cellularResult.element);

            const appleResult = window.CalendarEngine.renderMonth({
              year,
              monthIndex,
              language,
              startDay,
              country,
              layoutStyle: "apple",
            });
            appleSection.appendChild(appleResult.element);
          });

          comparisonContainer.appendChild(cellularSection);
          comparisonContainer.appendChild(appleSection);
        }

        populateLanguages();
        populateCountries();
        window.HolidayService?.init?.();
        window.CalendarEngine?.init?.();

        yearInput.value = new Date().getFullYear();
        renderCalendars();
        renderComparison();

        const allInputs = [yearInput, langSelect, startDaySelect, countrySelect];
        if (layoutStyleSelect) {
          allInputs.push(layoutStyleSelect);
        }
        allInputs.forEach((input) => {
          if (input) {
            input.addEventListener("change", () => {
              renderCalendars();
              renderComparison();
            });
          }
        });
      });
    </script>
  </head>
  <body>
    <h1>Calendar Engine Demo</h1>
    <p>
      Use the controls below to preview the first three months rendered by <code>CalendarEngine.renderMonth</code>.
    </p>

    <div class="controls">
      <label>
        Year
        <input id="demo-year" type="number" min="2020" max="2030" />
      </label>
      <label>
        Language
        <select id="demo-language"></select>
      </label>
      <label>
        Country
        <select id="demo-country"></select>
      </label>
      <label>
        Start Day
        <select id="demo-start-day">
          <option value="sunday">Sunday</option>
          <option value="monday">Monday</option>
          <option value="tuesday">Tuesday</option>
          <option value="wednesday">Wednesday</option>
          <option value="thursday">Thursday</option>
          <option value="friday">Friday</option>
          <option value="saturday">Saturday</option>
        </select>
      </label>
      <label>
        Layout Style
        <select id="demo-layout-style">
          <option value="cellular">Cellular (Rounded)</option>
          <option value="apple">Apple (Straight Lines)</option>
        </select>
      </label>
    </div>

    <section id="calendar-demo-grid" class="demo-grid" aria-live="polite"></section>

    <h2 style="margin-top: 3rem; margin-bottom: 1rem;">Style Comparison</h2>
    <p style="margin-bottom: 1rem; color: #475467;">
      Compare the same month rendered in both layout styles side by side:
    </p>
    <section id="calendar-comparison" class="style-comparison" aria-live="polite"></section>
  </body>
</html>
